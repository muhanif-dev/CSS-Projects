<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Challenge</title>
  <style>
    body {
      background: brown;
      margin: 0;
      padding: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .box {
      background: lightcyan;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
    }

   
    @media (max-width: 1240px) and (min-width: 601px) {
      .container {
        grid-template-columns: repeat(4, 1fr);
      }
    }

   
    @media (max-width: 600px) and (min-width: 321px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    
    @media (max-width: 320px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box">
      <h3>Name 1</h3>
      <p>I am hanif</p>
    </div>
    <div class="box">
      <h3>Name 2</h3>
      <p>I am hanif</p>
    </div>
    <div class="box">
      <h3>Name 3</h3>
      <p>I am hanif</p>
    </div>
    <div class="box">
      <h3>Name 4</h3>
      <p>I am hanif</p>
    </div>
  </div>

</body>
</html>
