<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="Login Form CSS.css.css">
</head>
<body>

    <section id="main">
                
        <section id="login">
                 <h1 style="color: #fb5600; font-size: 30px;">Log In</h1>
        </section>  

        <section id="des">
                   <input type="text" name="user" id="user" placeholder="UserName"><br>
                   
                   <input type="password" name="password" id="pass" placeholder="Password">
                 <section id="forg">
                             <input type="checkbox" name="checkbox" id="check">
                             <label for="checkbox" id="check-label"> Remember Me</label>
                             <button id="forg-btn" value="Forget Password">Forget Password</button>
                 </section>
                 <button id="log-btn" > Log in</button>
        </section>

               <h4 style="color: #fb5600; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; text-align: center;">Or Log in With</h4>
        <section id="icon">
                       <a href="#">Instagram</a>&nbsp |
                       <a href="#">Facebook</a>&nbsp |
                       <a href="#">Google</a>
        </section>

        <section id="sign">
                     <h6 style="color: #ffffff; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Don't Have an Accont?</h6>
                     <button id="sign-btn">Sign Up</button>
        </section>

    </section>
    
</body>
</html>
