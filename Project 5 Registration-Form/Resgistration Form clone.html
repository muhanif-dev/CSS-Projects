<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="Registration Form CSS.css.css">
</head>
<body>
    <Section id="full-section" style="background-color:#152046; width: 1350px; height: 840px; border-radius: 10px;">
         <section id="cols-section" style="width: 1240px; height: 500px; padding: 60px;">
            <section id="col-1" style="background-color:#96a4d3; width: 40%; height: 676px;">
                     <img src="5c7f3da72f4a3cdab08ee965038105ad.jpg" alt="This is an image" style="width: 80%; height: 60%; border-radius: 250px; border: 2px solid green;">
            </section>
            <section id="col-2" style="background-color: #aa8f76; width: 50%; height: 700px;">
                        <h2 id="register">Register</h2>
                        <h5 id="des">it's completly free</h5>
                        <form action="#" id="form">
                            <label for="Name" id="name-label">Name</label><br>
                            <input type="text" name="name" id="name-section" placeholder="Your Full Name" >
                            <label for="UserName" id="username-label">User Name</label><br>
                            <input type="text" name="username" id="username-section" placeholder="Username">
                            <label for="Email" id="email-label">Email</label><br>
                            <input type="email" name="email" id="email-section" placeholder="muhanif603@gmail.com"><br>
                            <label for="password" id="password-label">password</label><br>
                            <input type="password" name="password" id="password-section" placeholder="********"><br>
                            <label for="confirmpassword" id="confirmpassword-label">confirmpassword</label><br>
                            <input type="password" name="confirmpassword" id="confirmpassword-section" placeholder="*******"><br>
                            <input type="checkbox" name="checkbox" id="checkbox-section" style="margin-left: 10px;">
                            <label for="checkbox" id="checkbox-label" style="font-family: sans-serif; margin-left: 30px; width: 60%;">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quis veniam amet provident sapiente rerum atque officiis cumque assumenda alias vitae!</label><br>
                            <button type="submit" value="Create Account Now" id="btn">Create Account Now</button>
                        </form>
        
            </section>
         </section>
    </Section>
</body>
</html>
