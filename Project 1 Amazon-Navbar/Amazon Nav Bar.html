<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Nav Bar</title>
    <style>
        body
        {
            background-color:gray;
        }
        #nav-section
        {
            width: 100%;
            height: 60px;
            background-color: black;
            border: 2px solid white;
            color: white;
        }

        #nav
        {
            display: flex;
        }

        #nav, a
        {
            text-decoration: none;
            color: white;
            margin-right: 160px;
            margin-top: 10px;
    
        }

        #button
        {
            height: 20px;
            background-color: #f08804;
           margin-top: 2px;
           
        }

        #logo
        {
            color: #f08804;
            font-size: 25px;
        }

        #box-1, #box-2, #box-3
        {
            border: 2px solid white;
            width: 100px;
            height: 100px;
            display: inline-block;
        }
    </style>
</head>
<body>
      <div id="nav-section">
            
            <nav id="nav">
                <a href="#" id="logo">amazon.in</a>
                <a href="#">Account</a>
                <a href="#">My Cart</a>
                <a href="#">Contact Us</a>
                <input type="search" name="search" id="search" style="height: 25px;" placeholder="search in amazon">
                 <button id="button">Search</button>
            </nav>
                 
      </div>
  <div id="body">
      <div id="box-1">
           bay and get one free
      </div>
      <div id="box-2">
           bay and get one free
      </div>
      <div id="box-3">
           bay and get one free
      </div>

    </div>
</body>
</html>
